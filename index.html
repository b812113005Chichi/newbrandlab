<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI品牌煉金術 Brandlab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@500;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:#14142e;color:#f2f0ff;font-family:'Noto Sans TC',sans-serif;line-height:1.6}
.top{background:radial-gradient(circle at 20% 0,#3a3a8a 0,#282858 45%,#14142e 100%)}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font:900 clamp(34px,8vw,64px)/1.1 'Noto Sans TC';margin:20px 0 0;text-align:center;color:#fff;text-shadow:0 0 12px #ff3cac,0 0 32px #784ba0,3px 0 #2be4ff}
.en{font:900 clamp(18px,4vw,26px) Orbitron;text-align:center;letter-spacing:.4em;color:#2be4ff;text-shadow:0 0 10px #2be4ff}
.slogan{font-size:clamp(16px,3.4vw,21px);margin:0 0 12px;color:#eadfff;line-height:1.8}
.slogan b{color:#8fe3ff;font-weight:900;text-shadow:0 0 10px #2be4ff88}
.desc{font-size:15px;margin:0;color:#b9b4ea}
.intro{display:flex;gap:24px;align-items:center;flex-wrap:nowrap;margin:22px 0 26px}
.introt{flex:1 1 auto;min-width:0;text-align:left}
.cat{flex:0 1 190px;width:190px;min-width:64px;height:auto;filter:drop-shadow(0 0 12px #ff3cac44)}
@media(max-width:520px){.cat{flex-basis:96px;width:96px}}
.ic{display:inline-block;font-size:20px;margin-right:4px;vertical-align:-2px}
.card{background:rgba(20,20,50,.75);border:1px solid #2be4ff88;box-shadow:0 0 18px #2be4ff33,inset 0 0 20px #ff3cac18;border-radius:14px;padding:18px;margin-bottom:16px}
label,.lb{display:block;font-weight:700;margin-bottom:8px;color:#e6d9ff}
label small,.lb small{color:#7cc4dc;font-weight:400;opacity:.9}
input[type=text],textarea{width:100%;background:#0d0d24;color:#fff;border:1px solid #6b6bd0;border-radius:8px;padding:10px;font:inherit}
textarea{min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #6b6bd0;background:#0d0d24;color:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip.on{background:#ff3cac;border-color:#ff3cac;color:#000;font-weight:700}
.cats{max-height:190px;overflow:auto;padding:4px}
.row{display:flex;gap:8px;margin-top:8px}
button{font:inherit;cursor:pointer}
.btn{background:rgba(201,168,255,.16);color:#eadfff;border:1px solid #b79bff;border-radius:8px;padding:9px 16px;font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(201,168,255,.32)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 6px 4px 12px;margin:4px 6px 0 0;border:1px solid #fff5}
.tag b{cursor:pointer;background:#0006;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-weight:400}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid #fff}
.gen{display:block;margin:24px auto;font:900 22px Orbitron,'Noto Sans TC';background:linear-gradient(90deg,#ff3cac,#784ba0,#2be4ff);color:#fff;border:0;border-radius:12px;padding:16px 40px;box-shadow:0 0 24px #ff3cac88}
.gen:disabled{opacity:.6}
#err{color:#ff9aa8;text-align:center;min-height:24px}
#out{display:none}
#page{position:relative;--bg:#fff;--fg:#000;--c1:#000;--c2:#000;--c3:#000;background:var(--bg);color:var(--fg);border-radius:8px;overflow:hidden}
#page section{padding:26px 24px;position:relative;z-index:1}
.hero>*{position:relative;z-index:1}
.hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--c1);color:var(--h1t)}
.hero .logo{width:150px;height:150px;flex:none;background:#fff;border-radius:22px;padding:10px}
.hero .logo svg{width:100%;height:100%}
.bname{font-size:clamp(38px,9vw,68px);line-height:1.05;margin:0;font-weight:900}
.layout-center .hero{flex-direction:column;text-align:center}
.layout-poster .hero{flex-direction:column-reverse;align-items:flex-start;border-bottom:10px solid var(--c2)}
.layout-poster .bname{font-size:clamp(46px,12vw,92px)}
.sum{font-size:20px;line-height:1.9;margin:14px 0 0}
.pill{display:inline-block;border-radius:99px;padding:4px 14px;margin:8px 8px 0 0;font-size:14px;line-height:1.6;font-weight:700;color:#000}
h2{margin:0 0 12px;font-size:24px}
.prod{display:flex;flex-wrap:wrap;gap:10px}
.prod div{border-radius:10px;padding:10px 16px;font-weight:700}
.sim{border-left:6px solid var(--c2);padding:6px 12px;margin:10px 0}
#page a{color:inherit;font-weight:700}
.res{display:inline-block;border-radius:10px;padding:8px 14px;margin:4px 6px 4px 0}
.res small{display:block;font-weight:400}
.foot{background:#282858;color:#fff;text-align:center}
.foot .big{font-size:clamp(22px,5vw,32px);font-weight:900;margin:0 0 10px;color:#fff}
.foot a{color:#2be4ff}
.actions{text-align:center;margin-top:20px}
.dl{font:900 22px 'Noto Sans TC';padding:16px 40px;border:0;border-radius:12px;background:#2be4ff;color:#000;box-shadow:0 0 22px #2be4ff88}
.ig{display:inline-block;margin:14px 0;font:700 19px 'Noto Sans TC';padding:14px 26px;border-radius:12px;background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4);color:#fff;text-decoration:none}
.ok{color:#064;min-height:24px}
</style></head><body><div class="top"><div class="wrap">

 const long=cn>30||en>15;

 try{
